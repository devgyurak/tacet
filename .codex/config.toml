# Codex CLI 프로젝트 설정 (개인 ~/.codex/config.toml 위에 겹쳐진다).
#
# 모델 선택과 승인 정책은 일부러 넣지 않았다 — 개인 취향이라 ~/.codex/config.toml에 둔다.
# 이 파일에는 *이 저장소*에서 일하는 데 필요한 것만 둔다.

# Codex는 기본으로 AGENTS.md를 32KiB까지 읽는다. 정본이 한국어라 UTF-8로 글자당 3바이트가
# 들기 때문에 예산을 64KiB로 올린다. scripts/check_agent_config.py는 AGENTS.md가 이 값을
# 넘으면 실패한다.
project_doc_max_bytes = 65536

# 에이전트가 Bluetooth SIG Assigned Numbers, IEEE·3GPP 표, 크레이트 문서를 온라인에서 읽으므로
# 작업 공간 샌드박스의 네트워크를 연다. 수동성 가드(scripts/agent_hooks/guard_passive.py)는 여전히
# 디코더 프로젝트와 송신 도구를 막는다.
[sandbox_workspace_write]
network_access = true
exclude_tmpdir_env_var = false
