description = "탐지 품질을 검토한다. crates/core/의 규칙·가중치·교실 보정·기준선·기기 상관·다교실 위치 판정·신뢰도 로직이나 docs/rules/를 바꾼 뒤에 쓴다. 위협 모델 T1–T7 중 어떤 경로가 새로 뚫리거나 막히는지, 광고·Wi-Fi·업링크 신호가 서로를 어떻게 보완하는지, 오탐 요인(수거폰 미전원 차단, 옆 교실 재배정, 건물 밖, 감독관 장비, 의료기기·보청기, 랜덤 MAC, macOS UUID)이 늘어나는지, 고정 임계치가 숨어 들었는지, 규칙 노트와 코드·테스트가 일치하는지, 실측 없이 확정된 값이 있는지 본다. 읽기 전용."
