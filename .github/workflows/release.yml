name: release

# main의 커밋에 vX.Y.Z 태그를 달면 테스트 → Windows·macOS 빌드 → GitHub 릴리스(릴리스 노트 자동 생성)를 한다.
#
#   1. develop → main 릴리스 PR에서 Cargo.toml의 [workspace.package] version을 X.Y.Z로 올린다.
#   2. main에 병합된 커밋에 태그를 단다:  git tag vX.Y.Z origin/main && git push origin vX.Y.Z
#
# macOS .dmg는 Developer ID로 서명하고 공증한다. 인증서·공증 키는 저장소가 아니라 CI 비밀값으로만 받는다(AGENTS.md §7,
# docs/platform/packaging.md). Windows 표준 배포는 Microsoft Store의 MSIX다 — 여기서 만든 .msix를 Partner Center에 올리면
# Microsoft가 서명한다(작업 산출물 windows-store, 릴리스 파일에는 넣지 않는다). Store를 쓸 수 없는 PC용 .exe·.zip은 서명이
# 없다(TODO(phase2.9)).
# 릴리스 노트는 PR 라벨로 분류한다(.github/release.yml, commit 스킬 §7).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 태그 확인
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 태그 형식, main 포함 여부, 버전 일치
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::태그는 vX.Y.Z 형식이어야 한다: $TAG"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG가 가리키는 커밋이 main에 없다 — main에 병합된 커밋에만 태그를 단다"; exit 1; }
          version="$(grep -m1 -E '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          [ "v$version" = "$TAG" ] \
            || { echo "::error::Cargo.toml 버전($version)과 태그($TAG)가 다르다 — 릴리스 PR에서 버전을 올린다"; exit 1; }
          desktop="$(python3 -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"
          [ "v$desktop" = "$TAG" ] \
            || { echo "::error::desktop/package.json 버전($desktop)과 태그($TAG)가 다르다 — 함께 올린다"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: 테스트
    needs: check
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: build (windows)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust 툴체인 (고정)
        run: rustup toolchain install && rustup target add x86_64-pc-windows-msvc

      - name: cargo 의존성 캐시
        uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: false

      # Partner Center 제품 ID(공개 값)는 저장소 변수(vars)로 받는다. 없으면 Store에 올릴 수 없는 시험용 .msix가 나온다.
      - name: 백엔드·화면 빌드와 배포 파일
        env:
          TACET_APPX_IDENTITY_NAME: ${{ vars.TACET_APPX_IDENTITY_NAME }}
          TACET_APPX_PUBLISHER: ${{ vars.TACET_APPX_PUBLISHER }}
          TACET_APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.TACET_APPX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/package_windows.sh

      - name: MSIX 확인
        env:
          STORE_PUBLISHER: ${{ vars.TACET_APPX_PUBLISHER }}
          STORE_IDENTITY_NAME: ${{ vars.TACET_APPX_IDENTITY_NAME }}
        run: |
          msix="$(ls target/release/bundle/*.msix)"
          if [ -n "$STORE_PUBLISHER" ] || [ -n "$STORE_IDENTITY_NAME" ]; then
            python scripts/check_msix.py "$msix" --store
          else
            echo "::warning::Partner Center 제품 ID(vars.TACET_APPX_*)가 없어 Store에 올릴 수 없는 시험용 .msix다"
            python scripts/check_msix.py "$msix"
          fi

      # 백엔드가 이 OS에서 뜨는지: 설정 파일이 없으면 한국어 오류로 끝나야 한다.
      - name: 백엔드 실행 확인
        run: |
          set +e
          message="$(./desktop/resources/bin/tacet.exe --config 없는-설정.toml 2>&1)"
          code=$?
          set -e
          echo "$message"
          [ "$code" -ne 0 ] && grep -q "설정 파일을 읽지 못했다" <<<"$message"

      # 묶은 앱이 실제로 뜨고 화면을 그리는지: 시연 모델로 창을 캡처한다(장비·권한 없이).
      - name: 앱 실행 확인
        run: |
          ./target/release/bundle/win-unpacked/Tacet.exe --demo --screenshot "$RUNNER_TEMP/screen.png" &
          for _ in $(seq 1 60); do [ -s "$RUNNER_TEMP/screen.png" ] && break; sleep 1; done
          test -s "$RUNNER_TEMP/screen.png"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/*.exe
            target/release/bundle/*.zip
          if-no-files-found: error
          retention-days: 7

      # Store 제출용. 서명이 없어 직접 설치할 수 없으므로 GitHub 릴리스 파일에는 넣지 않는다.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-store
          path: target/release/bundle/*.msix
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: build (macos)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust 툴체인 (고정)
        run: rustup toolchain install

      - name: cargo 의존성 캐시
        uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: false

      # 서명용 임시 키체인: 비밀값의 .p12와 Apple Developer ID 중간 인증서(G2)를 넣는다. G2는 실행기에도 electron-builder에도
      # 없어서, 빠지면 인증서가 "유효하지 않음"으로 보이고 서명하지 못한다. 받은 G2는 고정한 SHA-256 지문으로 확인한다.
      - name: 서명 키체인
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CERT_P12 MAC_CERT_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::서명·공증 비밀값이 비어 있다: $name"; exit 1; }
          done
          umask 077
          keychain="$RUNNER_TEMP/tacet-sign.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" \
            | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::키체인에 유효한 Developer ID Application 인증서가 없다"; exit 1; }
          echo "TACET_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # Apple 실리콘과 Intel을 함께 담은 유니버설 앱과 .dmg. Developer ID 서명 + Hardened Runtime, 앱과 .dmg 모두 공증하고
      # 티켓을 붙인다(scripts/package_macos.sh).
      - name: 백엔드·화면 빌드, 서명, 공증
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./scripts/package_macos.sh

      - name: 실행 확인
        run: |
          app="target/release/bundle/mac-universal/Tacet.app"
          lipo -archs "$app/Contents/Resources/bin/tacet" | grep -q x86_64
          lipo -archs "$app/Contents/Resources/bin/tacet" | grep -q arm64
          backend="$app/Contents/Resources/bin/tacet"
          # 서명·공증: 앱 전체 서명, 백엔드의 Hardened Runtime과 위치 자격(없으면 Wi-Fi BSSID가 빈다), 티켓, Gatekeeper 판정.
          codesign --verify --deep --strict --verbose=2 "$app"
          flags="$(codesign -dv "$backend" 2>&1)"
          grep -q 'flags=.*runtime' <<<"$flags"
          entitlements="$(codesign -d --entitlements - --xml "$backend" 2>/dev/null)"
          grep -q 'com.apple.security.personal-information.location' <<<"$entitlements"
          xcrun stapler validate "$app"
          xcrun stapler validate target/release/bundle/*.dmg
          spctl -a -vvv -t exec "$app"
          spctl -a -vvv -t open --context context:primary-signature target/release/bundle/*.dmg
          set +e
          message="$("$app/Contents/Resources/bin/tacet" --config 없는-설정.toml 2>&1)"
          code=$?
          set -e
          echo "$message"
          [ "$code" -ne 0 ] && grep -q "설정 파일을 읽지 못했다" <<<"$message"
          "$app/Contents/MacOS/Tacet" --demo --screenshot "$RUNNER_TEMP/screen.png" &
          for _ in $(seq 1 60); do [ -s "$RUNNER_TEMP/screen.png" ] && break; sleep 1; done
          test -s "$RUNNER_TEMP/screen.png"
          hdiutil verify target/release/bundle/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/bundle/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: 서명 키체인 정리
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/tacet-sign.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

  publish:
    name: GitHub 릴리스
    needs: [check, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: 체크섬
        working-directory: dist
        run: sha256sum -- *.exe *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      # 이전 태그부터의 병합 PR을 라벨별로 묶은 노트(.github/release.yml)를 받아, 고정 안내를 앞에 붙인다.
      - name: 릴리스 노트
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body > generated.md
          {
            echo "## 설치 파일"
            echo
            echo "| OS | 파일 |"
            echo "|---|---|"
            echo "| Windows 11 (x64) | Microsoft Store(표준, 게시 준비 중) |"
            echo "| Windows 11 (x64) 설치 프로그램 — Store를 쓸 수 없는 PC | \`tacet-${{ needs.check.outputs.version }}-win-x64.exe\` |"
            echo "| Windows 11 (x64) 압축 파일 — Store를 쓸 수 없는 PC | \`tacet-${{ needs.check.outputs.version }}-win-x64.zip\` |"
            echo "| macOS (Apple 실리콘·Intel) | \`tacet-${{ needs.check.outputs.version }}-mac-universal.dmg\` |"
            echo
            echo "> macOS 파일은 Developer ID로 서명하고 Apple 공증을 받았다. Windows는 Microsoft Store 판이 표준이고(Microsoft 서명),"
            echo "> 여기 올린 .exe·.zip은 서명이 없어(Authenticode 없음) SmartScreen이 경고할 수 있다. 실제 시험장 적용 전에 주관 기관 승인과 법률 검토가 필요하다. 무결성은 \`SHA256SUMS.txt\`로 확인한다."
            echo ">"
            echo "> 라이선스: PolyForm Noncommercial 1.0.0 + 공식 배포본 추가 허가(\`LICENSE\`). 이 릴리스 파일은 상업 목적을 포함해 누구나 쓸 수 있고, 수정한 판은 비상업 목적으로만 쓸 수 있다."
            echo
            cat generated.md
          } > notes.md
          cat notes.md

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 0.x는 베타다 — GitHub에 사전 출시(pre-release)로 올린다(사용자 결정 2026-11-16).
          prerelease=()
          if [[ "$TAG" == v0.* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/*.exe dist/*.zip dist/*.dmg dist/SHA256SUMS.txt \
            --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
