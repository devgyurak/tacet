# 서버 모드: 시험본부 노트북. 센서는 화면의 센서 페어링 코드로, 감독관 뷰는 감독관 뷰 코드로 붙고, 태블릿은 웹
# 대시보드로 본다.
mode = "server"

[server]
# 이 노트북의 시험장 내부망 인터페이스 주소로 바꾼다(아래는 사설망 예시). 0.0.0.0(모든 인터페이스)은 다른 망에도
# 열리므로 쓰지 않는다 — 사설망·루프백·링크 로컬이 아닌 주소면 서버 화면에 경고가 뜬다.
bind = "10.0.0.10:47100"
dashboard_bind = "10.0.0.10:47180"
building = "본관"

[detector]
baseline_ms = 300000

[[layout.rooms]]
id = "3-1"
adjacent = ["3-2"]
sensors = [
  { id = "3-1-앞", position = "Front", inside_boundary_dbm = -75, wifi_inside_boundary_dbm = -65 },
  { id = "3-1-뒤", position = "Back", inside_boundary_dbm = -75, wifi_inside_boundary_dbm = -65 },
]

[[layout.rooms]]
id = "3-2"
adjacent = ["3-1", "3-3"]
sensors = [
  { id = "3-2-앞", position = "Front", inside_boundary_dbm = -75, wifi_inside_boundary_dbm = -65 },
  { id = "3-2-뒤", position = "Back", inside_boundary_dbm = -75, wifi_inside_boundary_dbm = -65 },
]

[[layout.rooms]]
id = "3-3"
adjacent = ["3-2"]
sensors = [
  { id = "3-3-앞", position = "Front", inside_boundary_dbm = -75, wifi_inside_boundary_dbm = -65 },
  { id = "3-3-뒤", position = "Back", inside_boundary_dbm = -75, wifi_inside_boundary_dbm = -65 },
]
