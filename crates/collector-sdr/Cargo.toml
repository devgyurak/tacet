[package]
name = "tacet-collector-sdr"
description = "SDR로 LTE FDD 업링크 대역 에너지를 잰다(R7). 수신만 하고 복조하지 않는다."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# 장비 수집(SoapySDR). 없으면 순수 계산만 빌드된다(AGENTS.md §2 규칙 8).
sdr = ["dep:soapysdr"]

[dependencies]
tacet-core.workspace = true
rustfft = "6"
tokio.workspace = true
soapysdr = { version = "0.4", optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
