[package]
name = "tacet"
description = "시험장 무선 기기 탐지기 백엔드(감독관 화면·단독·센서·서버). 화면은 desktop/의 Electron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# 선택 수집기를 앱에 넣는다(시스템 라이브러리 필요, AGENTS.md §2 규칙 8).
sdr = ["tacet-collector-sdr/sdr"]

[dependencies]
tacet-core.workspace = true
tacet-collector-ble.workspace = true
tacet-collector-wifi.workspace = true
tacet-collector-sdr.workspace = true
tacet-net.workspace = true
tacet-dashboard.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hex.workspace = true
rand.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# 메인 실행 루프(위치 권한 요청 처리). collector-wifi가 이미 쓰는 크레이트다.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSRunLoop", "NSDate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Power"] }

[dev-dependencies]
tacet-core = { workspace = true, features = ["testkit"] }
# 보정 시험이 시간을 멈추고 앞당긴다(`start_paused`). 같은 tokio의 시험용 기능일 뿐 새 크레이트가 아니다.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
