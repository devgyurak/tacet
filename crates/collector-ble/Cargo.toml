[package]
name = "tacet-collector-ble"
description = "BLE 광고 수집기: Windows는 WinRT 수동 스캔, macOS는 CoreBluetooth(btleplug)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tacet-core.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
btleplug = "0.11"
futures.workspace = true
uuid = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Foundation", "Foundation_Collections", "Storage_Streams"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
