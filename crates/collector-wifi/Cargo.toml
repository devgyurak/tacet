[package]
name = "tacet-collector-wifi"
description = "Wi-Fi 관리 모드 스캔 수집기: Windows WLAN API, macOS CoreWLAN"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tacet-core.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSSet", "NSError", "NSEnumerator"] }
objc2-core-wlan = { version = "0.3", features = ["CWWiFiClient", "CWInterface", "CWNetwork", "CWChannel", "CoreWLANTypes"] }
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLLocation"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
